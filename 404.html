                    back: '← Volver al portafolio',

            var language;
            try { language = localStorage.getItem('language'); } catch (e) {}
            if (!strings[language]) {
                language = (navigator.language || 'en').slice(0, 2).toLowerCase();
            }
            if (!strings[language]) language = 'en';
            var t = strings[language];
            document.documentElement.lang = language;

            document.getElementById('error-title').textContent = t.title;
            document.getElementById('error-text').textContent = t.text;
            document.getElementById('error-back').textContent = t.back;

            var path = location.pathname;
            try { path = decodeURIComponent(path); } catch (e) {}
            document.getElementById('error-path').textContent = path;

            // Sections and projects a visitor might have been typing
            var targets = [
                { keys: ['about', 'aboutme', 'me', 'background', 'cv', 'resume'], label: t.about, href: '/#about' },
                { keys: ['projects', 'project', 'work', 'portfolio'], label: t.projects, href: '/#projects' },

            function distance(a, b) {
                var row = [];
                for (var j = 0; j <= b.length; j++) row[j] = j;
                for (var i = 1; i <= a.length; i++) {
                    var previous = row[0];
                    row[0] = i;
                    for (var k = 1; k <= b.length; k++) {
                        var current = row[k];
                        row[k] = Math.min(row[k] + 1, row[k - 1] + 1, previous + (a[i - 1] === b[k - 1] ? 0 : 1));
                        previous = current;
                    }
                }
                return row[b.length];
            }

            // First path segment, lowercased, without extension or punctuation: "/Ka'A.html" -> "kaa"
            var slug = path.replace(/^\/+/, '').split('/')[0].toLowerCase()
